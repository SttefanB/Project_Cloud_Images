name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Copy Server Files to AWS EC2 via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_KEY }}
          source: "server/*"
          target: "~/"

      - name: SSH into EC2, Rebuild and Run Docker Container
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_KEY }}
          script: |
            cd server
            # Oprim containerul vechi (dacă există)
            docker stop vault-container || true
            # Ștergem containerul vechi pentru a elibera portul 8000
            docker rm vault-container || true
            # Ștergem imaginea veche pentru a ne asigura că se construiește de la zero
            docker rmi vault-server || true
            # Construim noua imagine
            docker build -t vault-server .
            # Pornim noul container
            docker run -d -p 8000:8000 --name vault-container vault-server